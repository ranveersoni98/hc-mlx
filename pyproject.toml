[project]
name = "hc-mlx"
version = "0.1.0"
description = "A small unserious house-type classifier (bungalow, apartment, villa, mansion, haveli) built on Apple MLX"
readme = "README.md"
authors = [
    { name = "Ranveer Soni", email = "git@ranveersoni.me" }
]
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.1.0",
    "duckdb>=1.5.6",
    "huggingface-hub>=2.2.0",
    "mlx>=0.32.3",
    "mlx-vision>=0.1.0",
    "pillow>=12.3.0",
]

[project.scripts]
hc-mlx = "hc_mlx.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
